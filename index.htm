<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Welcome to Our House</title>

<style>
  body {
    font-family: "Segoe UI", Roboto, sans-serif;
    background-color: #f7f4ef;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }

  .card {
    background: transparent;
    text-align: center;
    max-width: 600px;
    padding: 2rem;
    animation: fadeIn 1s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .welcome img {
    width: 100%;
    max-width: 500px;
    margin-bottom: 1.5rem;
  }

  .qr-area {
    margin-top: 2rem;
  }

  .qr-area img {
    width: 100%;
    max-width: 300px;
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(30, 58, 95, 0.3);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .qr-area img:hover {
    transform: scale(1.05);
    box-shadow: 0 0 30px rgba(30, 58, 95, 0.6);
  }

  .credentials {
    margin-top: 1.5rem;
    font-size: 1.1rem;
    color: #1e3a5f;
  }

  .credentials strong {
    color: #5a4633;
  }
</style>
</head>

<body>
  <div class="card">
    <div class="welcome">
      <!-- Replace with your transparent welcome sign -->
      <img src="welcome-sign.png" alt="Welcome Sign" />
    </div>

    <div class="qr-area">
      <!-- Replace with your QR code image -->
      <img src="qr-code.png" alt="Wi-Fi QR Code" />
    </div>

    <div class="credentials">
      <p><strong>WiFi SSID:</strong> <span id="ssid">SKYNET-Guest</span></p>
      <p><strong>Password:</strong> <span id="password">IoT@51MedleyLane</span></p>
    </div>
  </div>
</body>
</html>
