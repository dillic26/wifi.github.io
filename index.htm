<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Welcome to Our House</title>

<style>
  body {
    font-family: "Segoe UI", Roboto, sans-serif;
    background-color: #f7f4ef;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }

  .card {
    background: #fff;
    border: 3px solid #c2bfb7;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    padding: 2rem;
    text-align: center;
    max-width: 420px;
    animation: fadeIn 1s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .header img {
    width: 100px;
    margin-bottom: 0.5rem;
  }

  .header h1 {
    color: #1e3a5f;
    font-size: 1.8rem;
    margin: 0.3rem 0;
  }

  .subtitle {
    color: #5a4633;
    font-weight: 600;
    font-size: 1.1rem;
  }

  .wifi-info {
    display: flex;
    justify-content: space-around;
    margin: 1.5rem 0;
  }

  .wifi-info img {
    width: 90px;
    height: 90px;
    border-radius: 10px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    box-shadow: 0 0 10px rgba(30, 58, 95, 0.2);
  }

  @keyframes glow {
    0% { box-shadow: 0 0 10px rgba(30, 58, 95, 0.3); }
    50% { box-shadow: 0 0 20px rgba(30, 58, 95, 0.6); }
    100% { box-shadow: 0 0 10px rgba(30, 58, 95, 0.3); }
  }

  .wifi-info img:hover {
    transform: scale(1.05);
    animation: glow 1.5s infinite;
  }

  .wifi-info p {
    margin-top: 0.5rem;
    font-weight: 500;
    color: #333;
  }

  .credentials {
    border-top: 2px solid #dcd7cf;
    padding-top: 1rem;
    font-size: 1rem;
    color: #1e3a5f;
  }

  .credentials strong {
    color: #5a4633;
  }
</style>
</head>

<body>
  <div class="card">
    <div class="header">
      <!-- Replace with your welcome sign image -->
      <img src="welcome-sign.png" alt="Welcome Sign" />
      <h1>Welcome to Our House</h1>
      <p class="subtitle">Enjoy Our Wi‑Fi!</p>
    </div>

    <div class="wifi-info">
      <div class="android">
        <!-- Replace with your NFC icon -->
        <img src="nfc-icon.png" alt="NFC Icon" />
        <p>Tap for Android</p>
      </div>
      <div class="iphone">
        <!-- Replace with your QR code -->
        <img src="qr-code.png" alt="QR Code" />
        <p>Scan for iPhone</p>
      </div>
    </div>

    <div class="credentials">
      <p><strong>Network:</strong> <span id="ssid">YourNetworkName</span></p>
      <p><strong>Password:</strong> <span id="password">YourPassword</span></p>
    </div>
  </div>
</body>
</html>
